<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Vue 3D Academia</title>
<!--
  Vue 3D du Localisateur Academia (extension Chrome), affichée dans un iframe de la vue de vérification de l'extension.
  Elle ne contient ni donnée ni code du moteur : l'extension lui envoie des positions et des contours par postMessage, elle les dessine sur une carte
  3D Google (Maps JavaScript API, 3D Maps). Affichage seulement : rien n'est capturé, stocké ni renvoyé, sauf les clics et la position de la caméra.
  Google n'est chargé que dans un iframe de l'extension (origine vérifiée) ; ouverte seule ou ailleurs, la page ne charge rien.
  La clé est limitée par Google à l'adresse de cette page et à la seule Maps JavaScript API.
  Source : dépôt du Localisateur, page-3d/index.html ; publiée par tools/publier-page-3d.mjs (qui pose la clé).
-->
<style>
html,body{margin:0;height:100%;background:#1a2340;overflow:hidden}gmp-map-3d{position:absolute;inset:0}
#msg{position:absolute;inset:0;display:grid;place-items:center;color:#c8cbe0;font:14px Inter,system-ui,sans-serif;text-align:center;padding:20px}
</style>
</head>
<body>
<div id="msg">Vue 3D…</div>
<script>
"use strict";
const CLE = "AIzaSyCC--aFNVO_o5rFzVQwQ4BxvZfqvZu9Ycs"; // posée à la publication (tools/publier-page-3d.mjs), jamais dans le dépôt du Localisateur
const VERSION = "beta";
const EXT = ["chrome-extension://bjoapcmbjmollccjocdacbobdpfekmgk"]; // l'extension : identifiant calculé à la publication depuis la clé du manifeste (tools/publier-page-3d.mjs), jamais écrit à la main
// Protocole v1. Extension → page : init, camera, couches, orbite, stop, gestes. Page → extension : pret, refus, google, chargee, stable, erreur, clic, camera, repere.
const P = { parent: null, origine: null, carte: null, lib: null, mk: null, couches: { parcelles: [], selection: [], reperes: [], cercle: [], piscines: [] }, visible: true, enAttente: [], chargee: false };
const anc = location.ancestorOrigins && location.ancestorOrigins.length ? location.ancestorOrigins[0] : null;
const AUTORISEE = window.parent !== window && !!anc && EXT.includes(anc); // seulement dans un iframe posé directement par l'extension
const msg = t => { const m = document.getElementById("msg"); if (m) m.textContent = t; };
const envoyer = m => { if (P.parent && P.origine) P.parent.postMessage(Object.assign({ v: 1 }, m), P.origine); };
const erreur = raison => { if (P.erreurDite) return; P.erreurDite = true; envoyer({ type: "erreur", raison }); msg(""); }; // une seule fois, au chargement comme pendant la consultation
window.gm_authFailure = () => erreur("cle-refusee");
const ce = console.error.bind(console); console.error = (...a) => { const t = a.map(String).join(" "); if (/OverQuota|over_query_limit|quota/i.test(t)) erreur("quota"); else if (/RefererNotAllowed|ApiNotActivated|BillingNotEnabled|InvalidKey|ApiTargetBlocked/i.test(t)) erreur("cle-refusee"); ce(...a); };
const ll = (lat, lon, alt) => ({ lat: +lat, lng: +lon, altitude: +alt || 0 });

function charger() {
  if (!CLE || /^__/.test(CLE)) return erreur("sans-cle");
  envoyer({ type: "google" }); // la carte part chez Google : l'extension la compte (plafond du poste, journal)
  return new Promise((ok, ko) => {
    window.__gm = ok; const s = document.createElement("script");
    s.src = "https://maps.googleapis.com/maps/api/js?" + new URLSearchParams({ key: CLE, v: VERSION, libraries: "maps3d,marker", loading: "async", callback: "__gm", language: "fr", region: "FR" });
    s.onerror = () => ko(new Error("script")); document.head.append(s);
  }).then(async () => {
    P.lib = await google.maps.importLibrary("maps3d"); P.mk = await google.maps.importLibrary("marker");
    const c = (P.init && P.init.camera) || { center: { lat: 46.6, lon: 2.4, alt: 0 }, range: 900000, tilt: 0, heading: 0 };
    P.carte = new P.lib.Map3DElement({ center: ll(c.center.lat, c.center.lon, c.center.alt), range: c.range, tilt: c.tilt, heading: c.heading || 0, mode: P.lib.MapMode.SATELLITE, defaultUIHidden: true, gestureHandling: "GREEDY" });
    P.carte.addEventListener("gmp-error", () => erreur("carte"));
    P.carte.addEventListener("gmp-steadychange", e => { if (e.isSteady && !P.chargee) { P.chargee = true; envoyer({ type: "chargee" }); } if (e.isSteady) envoyer({ type: "stable" }); });
    P.carte.addEventListener("gmp-click", e => { const p = e.position; if (p) envoyer({ type: "clic", lat: p.lat, lon: p.lng, alt: p.altitude }); });
    let t = 0; const cam = () => { clearTimeout(t); t = setTimeout(() => { const k = P.carte, x = k.center; if (x) envoyer({ type: "camera", center: { lat: x.lat, lon: x.lng, alt: x.altitude }, range: k.range, tilt: k.tilt, heading: k.heading }); }, 150); };
    ["gmp-centerchange", "gmp-rangechange", "gmp-tiltchange", "gmp-headingchange"].forEach(ev => P.carte.addEventListener(ev, cam));
    document.getElementById("msg").remove(); document.body.append(P.carte);
    setTimeout(() => { if (!P.chargee) erreur("delai"); }, 45000); // « chargée » seulement sur un vrai signal de stabilité de Google ; sans lui, échec de chargement
    P.enAttente.splice(0).forEach(traiter);
  }).catch(() => erreur("script"));
}
function vider(nom) { for (const e of P.couches[nom]) e.remove(); P.couches[nom] = []; }
const anneau = r => r.map(([lon, lat]) => ({ lat, lng: lon }));
const garder = (nom, e) => { if (!P.visible) e.style.display = "none"; P.carte.append(e); P.couches[nom].push(e); };
function dessiner(d) {
  const L = P.lib;
  if ("parcelles" in d) { vider("parcelles"); for (const r of d.parcelles || []) garder("parcelles", new L.Polyline3DElement({ path: anneau(r), altitudeMode: "CLAMP_TO_GROUND", strokeColor: "rgba(255,255,255,.8)", strokeWidth: 1.5, drawsOccludedSegments: true })); }
  if ("selection" in d) { vider("selection"); for (const r of d.selection || []) garder("selection", new L.Polyline3DElement({ path: anneau(r), altitudeMode: "CLAMP_TO_GROUND", strokeColor: "#FFD60A", strokeWidth: 4, drawsOccludedSegments: true, zIndex: 2 })); }
  if ("piscines" in d) { vider("piscines"); for (const r of d.piscines || []) garder("piscines", new L.Polyline3DElement({ path: anneau(r), altitudeMode: "CLAMP_TO_GROUND", strokeColor: "#4FD8FF", strokeWidth: 1.2, drawsOccludedSegments: false })); }
  if ("cercle" in d) { vider("cercle"); for (const c of d.cercle ? [].concat(d.cercle) : []) { const n = 96, R = Math.PI / 180, path = Array.from({ length: n + 1 }, (_, i) => { const a = i * 2 * Math.PI / n; return { lat: c.lat + c.rayon * Math.cos(a) / 111200, lng: c.lon + c.rayon * Math.sin(a) / (111320 * Math.cos(c.lat * R)) }; }); garder("cercle", new L.Polyline3DElement({ path, altitudeMode: "CLAMP_TO_GROUND", strokeColor: c.couleur || "#FF5A00", strokeWidth: 2.5, drawsOccludedSegments: true })); } }
  if ("reperes" in d) { vider("reperes"); for (const r of d.reperes || []) { const e = new L.Marker3DInteractiveElement({ position: ll(r.lat, r.lon, r.hauteur || 18), altitudeMode: "RELATIVE_TO_GROUND", extruded: true }); e.append(new P.mk.PinElement({ glyphText: String(r.n), background: r.sel ? "#FF5A00" : "#2B44D6", borderColor: "#070C28", glyphColor: "#fff", scale: r.sel ? 1.3 : 1 })); e.addEventListener("gmp-click", () => envoyer({ type: "repere", n: r.n, cle: r.cle })); garder("reperes", e); } }
  if ("visible" in d) { P.visible = !!d.visible; for (const nom of Object.keys(P.couches)) for (const e of P.couches[nom]) e.style.display = P.visible ? "" : "none"; }
}
function camera(d) {
  const k = P.carte; if (k.stopCameraAnimation) k.stopCameraAnimation();
  const c = d.center || (k.center && { lat: k.center.lat, lon: k.center.lng, alt: k.center.altitude });
  const end = { center: ll(c.lat, c.lon, c.alt), range: d.range ?? k.range, tilt: d.tilt ?? k.tilt, heading: d.heading ?? k.heading };
  if (d.duree > 0) k.flyCameraTo({ endCamera: end, durationMillis: d.duree }); else Object.assign(k, end);
}
function traiter(d) {
  if (!P.carte) { P.enAttente.push(d); return; }
  if (d.type === "camera") camera(d); else if (d.type === "couches") dessiner(d);
  else if (d.type === "orbite") { const k = P.carte, c = d.center ? ll(d.center.lat, d.center.lon, d.center.alt) : k.center; k.flyCameraAround({ camera: { center: c, range: d.range ?? k.range, tilt: d.tilt ?? k.tilt, heading: d.heading ?? k.heading }, durationMillis: d.duree || 24000, repeatCount: d.tours || 1 }); }
  else if (d.type === "stop") P.carte.stopCameraAnimation();
  else if (d.type === "gestes") P.carte.gestureHandling = d.actifs ? "GREEDY" : "NONE";
}
if (!AUTORISEE) { msg("Page réservée au Localisateur Academia."); if (window.parent !== window && anc && /^chrome-extension:\/\//.test(anc)) window.parent.postMessage({ v: 1, type: "refus" }, anc); } // une extension que la page n'accepte pas : elle le dit (sans donnée), Google n'est pas chargé
else {
  window.addEventListener("message", e => {
    if (!EXT.includes(e.origin) || e.source !== window.parent || !e.data || e.data.v !== 1) return; // seulement l'extension qui contient l'iframe, protocole v1
    if (!P.parent) { P.parent = e.source; P.origine = e.origin; }
    if (e.data.type === "init") { P.init = e.data; if (!P.charge) { P.charge = true; charger(); } return; }
    traiter(e.data);
  });
  window.parent.postMessage({ v: 1, type: "pret" }, anc); // aucune donnée : l'extension sait que la page écoute
}
</script>
</body>
</html>
